name: Sync Multiple Forks

on:
  schedule:
    # Runs every 4 hours (at 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC)
    - cron: '15 */4 * * *'

  # Allows manual triggers from the GitHub Actions web UI.
  workflow_dispatch:

# Deny default GITHUB_TOKEN permissions; all writes are authenticated via SYNC_PAT.
permissions: {}

# Prevent overlapping scheduled executions from running concurrently.
concurrency:
  group: sync-multiple-forks
  cancel-in-progress: false

jobs:
  sync-forks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      # Ensure failure of one fork does not cancel others.
      fail-fast: false

      matrix:
        include:
          - repo: "nakoo/android_kernel_google_msm-4.14"
            branch: "lineage-24.0"
            source: "LineageOS/android_kernel_google_msm-4.14"

          - repo: "nakoo/NonGKI_Kernel_Build_2nd"
            branch: "mainline"
            source: "JackA1ltman/NonGKI_Kernel_Build_2nd"

          - repo: "nakoo/BakaSU"
            branch: "main"
            source: "Baka-SU/BakaSU"

          - repo: "nakoo/Baseband-guard"
            branch: "main"
            source: "vc-teahouse/Baseband-guard"

          - repo: "nakoo/nomount"
            branch: "master"
            source: "maxsteeel/nomount"

          - repo: "nakoo/NeoZygisk"
            branch: "master"
            source: "JingMatrix/NeoZygisk"

          - repo: "nakoo/TEESimulator"
            branch: "dev"
            source: "JingMatrix/TEESimulator"

          - repo: "nakoo/PlayIntegrityFork"
            branch: "main"
            source: "osm0sis/PlayIntegrityFork"

          - repo: "nakoo/specter"
            branch: "main"
            source: "dpejoh/specter"

          - repo: "nakoo/HMA-OSS"
            branch: "master"
            source: "frknkrc44/HMA-OSS"

          - repo: "nakoo/BRENE"
            branch: "main"
            source: "rrr333nnn333/BRENE"

          - repo: "nakoo/ih8SecureLock"
            branch: "master"
            source: "j-hc/ih8SecureLock"

          - repo: "nakoo/kime"
            branch: "develop"
            source: "Riey/kime"

    steps:
      - name: Verify SYNC_PAT exists
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "SYNC_PAT secret is missing or empty." >&2
            exit 1
          fi

          echo "SYNC_PAT is present."

      - name: Show target configuration
        env:
          REPO: ${{ matrix.repo }}
          BRANCH: ${{ matrix.branch }}
          SOURCE: ${{ matrix.source }}
        run: |
          set -euo pipefail

          echo "Target Repo:   $REPO"
          echo "Target Branch: $BRANCH"

          if [ -n "$SOURCE" ]; then
            echo "Source Repo:   $SOURCE"
          else
            echo "Source Repo:   <auto-detected upstream>"
          fi

      - name: Synchronize fork with upstream
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
          REPO: ${{ matrix.repo }}
          BRANCH: ${{ matrix.branch }}
          SOURCE: ${{ matrix.source }}
        run: |
          set -euo pipefail

          if [ -n "$SOURCE" ]; then
            echo "Executing: gh repo sync $REPO --branch $BRANCH --source $SOURCE"
            gh repo sync "$REPO" --branch "$BRANCH" --source "$SOURCE"
          else
            echo "Executing: gh repo sync $REPO --branch $BRANCH"
            gh repo sync "$REPO" --branch "$BRANCH"
          fi

  sync-bakasu-pr:
    needs: sync-forks
    runs-on: ubuntu-latest
    steps:
      - name: Build and push main-with-pr-637 branch
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git clone "https://x-access-token:${GH_TOKEN}@github.com/nakoo/BakaSU.git" repo
          cd repo

          git remote add upstream https://github.com/Baka-SU/BakaSU.git
          git fetch upstream pull/637/head:pr-637
          git checkout -B main-with-pr-637 origin/main
          if ! git merge --no-edit pr-637; then
            echo "::error::Merge conflict detected when applying PR 637 to main."
            echo "=== Conflicted Files ==="
            git diff --name-only --diff-filter=U
            echo "=== Conflict Details ==="
            git diff
            exit 1
          fi
          git push origin main-with-pr-637 --force
